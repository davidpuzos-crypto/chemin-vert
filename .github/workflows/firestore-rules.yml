name: Règles Firestore

# Les règles sont la SEULE protection de la base : la clé Firebase du site est
# publique par conception. Ce workflow garantit deux choses :
#   1. firebase/firestore.rules passe ses tests avant toute publication ;
#   2. ce fichier est bien ce qui tourne en production, donc plus de dérive
#      silencieuse entre le dépôt et la console Firebase — c'est exactement ce
#      qui s'était produit : la console portait une version plus permissive.

on:
  push:
    branches: ["main"]
    paths:
      - "firebase/firestore.rules"
      - "firebase/rules.test.mjs"
      - "firebase.json"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firebase/firestore.rules"
      - "firebase/rules.test.mjs"
      - "firebase.json"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      # Vide tant que le secret n'est pas configuré : la publication est alors
      # ignorée, mais les tests tournent quand même.
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pas de npm ci : ces outils ne servent qu'ici, on ne les fige pas dans
      # les dépendances du site (qui n'a aucune étape de build).
      - name: Installer les outils de test
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: Jouer les tests des règles sur l'émulateur
        run: npx firebase emulators:exec --only firestore --project demo-cv "node firebase/rules.test.mjs"

      - name: Publier les règles sur Firebase
        if: github.event_name != 'pull_request' && env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only firestore:rules \
              --project chemin-vert-848b6 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Publication ignorée
        if: github.event_name != 'pull_request' && env.SA == ''
        run: |
          echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT absent : les règles"
          echo "::warning::ont été testées mais PAS publiées. Les règles de la"
          echo "::warning::console peuvent donc différer de ce dépôt."
