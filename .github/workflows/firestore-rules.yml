name: Règles Firestore

# Les règles sont la SEULE protection de la base : la clé Firebase du site est
# publique par conception. Ce workflow garantit deux choses :
#   1. firebase/firestore.rules passe ses tests avant toute publication ;
#   2. ce fichier est bien ce qui tourne en production, donc plus de dérive
#      silencieuse entre le dépôt et la console Firebase — c'est exactement ce
#      qui s'était produit : la console portait une version plus permissive.

on:
  push:
    branches: ["main"]
    paths:
      - "firebase/firestore.rules"
      - "firebase/rules.test.mjs"
      - "firebase.json"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firebase/firestore.rules"
      - "firebase/rules.test.mjs"
      - "firebase.json"
      # Le workflow lui-même : une modification de son environnement doit être
      # éprouvée par une pull request, pas découverte après la fusion.
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      # Vide tant que le secret n'est pas configuré : la publication est alors
      # ignorée, mais les tests tournent quand même.
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # L'émulateur Firestore est un programme Java : sans JDK explicite, il
      # dépend de ce que l'image du runner embarque, qui change sans préavis.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pas de npm ci : ces outils ne servent qu'ici, on ne les fige pas dans
      # les dépendances du site (qui n'a aucune étape de build). Les majeures
      # sont épinglées : ce sont celles sur lesquelles les tests sont vérifiés.
      - name: Installer les outils de test
        run: |
          npm install --no-save --no-audit --no-fund \
            firebase@13 @firebase/rules-unit-testing@5 firebase-tools@15

      # Tracé dans le journal : en cas de dérive d'une image de runner, la
      # cause saute aux yeux sans avoir à rejouer le workflow à l'aveugle.
      - name: Environnement
        run: |
          echo "node     : $(node -v)"
          echo "java     : $(java -version 2>&1 | head -1)"
          echo "firebase : $(npx firebase --version)"

      - name: Jouer les tests des règles sur l'émulateur
        run: |
          set -o pipefail
          if ! npx firebase emulators:exec --only firestore --project demo-cv \
                 "node firebase/rules.test.mjs" 2>&1 | tee "$RUNNER_TEMP/emulateur.log"; then
            # Remonté en annotations : les journaux bruts ne sont pas toujours
            # consultables, les annotations le sont toujours.
            echo "::error::Échec des tests de règles. Dernières lignes :"
            tail -n 12 "$RUNNER_TEMP/emulateur.log" \
              | while IFS= read -r ligne; do echo "::error::$ligne"; done
            exit 1
          fi

      - name: Publier les règles sur Firebase
        if: github.event_name != 'pull_request' && env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only firestore:rules \
              --project chemin-vert-848b6 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Publication ignorée
        if: github.event_name != 'pull_request' && env.SA == ''
        run: |
          echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT absent : les règles"
          echo "::warning::ont été testées mais PAS publiées. Les règles de la"
          echo "::warning::console peuvent donc différer de ce dépôt."
