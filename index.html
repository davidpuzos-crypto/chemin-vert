<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemin Vert — Un mouvement humaniste</title>
  <meta name="description" content="Une charte de valeurs universelles que chacun peut signer. Rejoignez un mouvement qui refuse l'injustice et la violence, en sept langues." />
  <meta name="theme-color" content="#14713c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2314713c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<!-- Partage social et indexation -->
  <!-- Ces valeurs sont celles que lisent Google et les robots des réseaux
       sociaux : ils n'exécutent pas le JavaScript, donc le moteur i18n ne les
       remplace que pour le visiteur, sans effet sur l'indexation. -->
  <link rel="canonical" href="https://cheminvert.org/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Chemin Vert" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="https://cheminvert.org/" />
  <meta property="og:title" content="Chemin Vert — Un mouvement humaniste" />
  <meta property="og:description" content="Une charte de valeurs universelles que chacun peut signer. Rejoignez un mouvement qui refuse l'injustice et la violence, en sept langues." />
  <meta property="og:image" content="https://cheminvert.org/assets/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Chemin Vert — Reprenons le chemin des valeurs qui nous unissent" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chemin Vert — Un mouvement humaniste" />
  <meta name="twitter:description" content="Une charte de valeurs universelles que chacun peut signer. Rejoignez un mouvement qui refuse l'injustice et la violence, en sept langues." />
  <meta name="twitter:image" content="https://cheminvert.org/assets/og-image.png" />
  <!-- Données structurées : décrivent le site à Google en termes qu'il
       comprend. Le type « application/ld+json » n'est pas du script
       exécutable, la politique de sécurité du site le laisse donc passer. -->
  <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://cheminvert.org/#site",
        "url": "https://cheminvert.org/",
        "name": "Chemin Vert",
        "description": "Une charte de quinze valeurs humaines universelles, que chacun peut signer.",
        "inLanguage": [
          "fr",
          "en",
          "es",
          "it",
          "de",
          "tr",
          "ar"
        ],
        "publisher": {
          "@id": "https://cheminvert.org/#org"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://cheminvert.org/#org",
        "name": "Chemin Vert",
        "alternateName": "Mouvement Chemin Vert",
        "url": "https://cheminvert.org/",
        "logo": "https://cheminvert.org/assets/og-image.png",
        "image": "https://cheminvert.org/assets/og-image.png",
        "email": "contact@cheminvert.org",
        "description": "Un mouvement humaniste réuni autour d'une charte de quinze valeurs universelles : légalité et éthique, amour, respect et fraternité."
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="welcome">
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
  </div>

  <main class="welcome__stage">
    <div class="wordmark welcome__brand" aria-label="Chemin Vert">
      <span class="wm-line wm-line--top"><i>C</i><i>H</i><i>E</i><i>M</i><i>I</i><i>N</i></span>
      <span class="wm-line wm-line--bottom"><i>V</i><i>E</i><i>R</i><i>T</i></span>
    </div>

    <p class="welcome__choose" id="wChoose">Choisissez votre langue</p>

    <div class="flower" id="flower">
      <button class="bloom" id="bloom" aria-label="Entrer">
        <span class="bloom__flag" id="bloomFlag">🇫🇷</span>
        <span class="bloom__lang" id="bloomLang">Français</span>
        <span class="bloom__enter" id="bloomEnter">Entrer</span>
      </button>
    </div>

    <button class="welcome__skip" id="wSkip" type="button">Passer</button>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/welcome.js"></script>
</body>
</html>
