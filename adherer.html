<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signer la charte — Chemin Vert</title>
  <meta name="description" content="Affichez votre adhésion aux valeurs du Chemin Vert. Une adresse e-mail suffit, rien d'autre n'est demandé, et vous pouvez vous retirer à tout moment." />
  <meta name="theme-color" content="#14713c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2314713c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<!-- Partage social et indexation -->
  <!-- Ces valeurs sont celles que lisent Google et les robots des réseaux
       sociaux : ils n'exécutent pas le JavaScript, donc le moteur i18n ne les
       remplace que pour le visiteur, sans effet sur l'indexation. -->
  <link rel="canonical" href="https://cheminvert.org/adherer.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Chemin Vert" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="https://cheminvert.org/adherer.html" />
  <meta property="og:title" content="Signez la charte du Chemin Vert" />
  <meta property="og:description" content="Affichez votre adhésion aux valeurs du Chemin Vert. Une adresse e-mail suffit, rien d'autre n'est demandé, et vous pouvez vous retirer à tout moment." />
  <meta property="og:image" content="https://cheminvert.org/assets/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Chemin Vert — Reprenons le chemin des valeurs qui nous unissent" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Signez la charte du Chemin Vert" />
  <meta name="twitter:description" content="Affichez votre adhésion aux valeurs du Chemin Vert. Une adresse e-mail suffit, rien d'autre n'est demandé, et vous pouvez vous retirer à tout moment." />
  <meta name="twitter:image" content="https://cheminvert.org/assets/og-image.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="join" data-title-key="nav.join">
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="bg-leaves" id="leaves"></div>
  </div>

  <div id="site-header"></div>

  <main>
    <!-- Compteur géant -->
    <section class="join-hero">
      <div class="container reveal">
        <p class="join-hero__pre" data-i18n="join.hero_pre">Nous sommes déjà</p>
        <div class="join-hero__num"><span class="js-counter">—</span></div>
        <p class="join-hero__post" data-i18n="join.hero_post">à avoir signé la charte</p>
        <div class="milestone milestone--wide" data-milestone>
          <div class="milestone__head">
            <span data-i18n="milestone.next">Prochain objectif</span>
            <span><span class="milestone__cur js-counter">—</span> / <span class="milestone__goal">—</span></span>
          </div>
          <div class="milestone__bar"><span class="milestone__fill"></span></div>
        </div>
      </div>
    </section>

    <!-- Formulaire -->
    <section class="section section--tight" id="sign">
      <div class="container sign__card reveal">
        <p class="tag" data-i18n="sign.tag">Rejoindre</p>
        <h2 class="section__title" data-i18n="join.title">Ajoutez votre voix</h2>
        <p class="section__intro" data-i18n="join.text"></p>
        <form class="sign__form" id="signForm" novalidate>
          <input type="email" id="signEmail" class="sign__input" required autocomplete="email"
                 data-i18n-attr="placeholder:sign.placeholder" placeholder="votre@email.com" />
          <button type="submit" class="btn btn--primary btn--lg" id="signBtn">
            <span data-i18n="sign.button">Je signe</span>
          </button>

          <!-- Consentement explicite : le RGPD demande un acte positif, donc
               une case NON cochée par défaut. Le libellé et le lien sont deux
               chaînes distinctes : le moteur i18n écrit du texte, pas du HTML. -->
          <label class="sign__consent" for="signConsent">
            <input type="checkbox" id="signConsent" />
            <span>
              <span data-i18n="sign.consent">J'accepte que mon adresse e-mail soit conservée pour comptabiliser ma signature.</span>
              <a href="confidentialite.html" data-i18n="legal.privacy">Politique de confidentialité</a>
            </span>
          </label>
        </form>
        <p class="sign__msg" id="signMsg" role="status" aria-live="polite"></p>
        <p class="sign__privacy" data-i18n="sign.privacy"></p>

        <!-- Désinscription -->
        <div class="unsub" id="unsub">
          <button type="button" class="unsub__toggle" id="unsubToggle" aria-expanded="false" data-i18n="unsub.link">Se désinscrire</button>
          <div class="unsub__panel" id="unsubPanel" hidden>
            <p class="unsub__intro" data-i18n="unsub.intro">Entrez l'adresse utilisée pour signer.</p>
            <form class="sign__form" id="unsubForm" novalidate>
              <input type="email" id="unsubEmail" class="sign__input" autocomplete="email"
                     data-i18n-attr="placeholder:sign.placeholder" placeholder="votre@email.com" />
              <button type="submit" class="btn btn--ghost" id="unsubBtn">
                <span data-i18n="unsub.button">Se désinscrire</span>
              </button>
            </form>
            <p class="sign__msg" id="unsubMsg" role="status" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Pourquoi adhérer -->
    <section class="section section--tight">
      <div class="container">
        <h2 class="section__title section__title--center reveal" data-i18n="join.why_t">Pourquoi adhérer ?</h2>
        <div class="why">
          <article class="why__item reveal">
            <span class="why__num">01</span>
            <h3 data-i18n="join.why1_t">Gratuit et simple</h3>
            <p data-i18n="join.why1_d"></p>
          </article>
          <article class="why__item reveal">
            <span class="why__num">02</span>
            <h3 data-i18n="join.why2_t">Vous comptez</h3>
            <p data-i18n="join.why2_d"></p>
          </article>
          <article class="why__item reveal">
            <span class="why__num">03</span>
            <h3 data-i18n="join.why3_t">Vous restez informé</h3>
            <p data-i18n="join.why3_d"></p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/signatures.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
