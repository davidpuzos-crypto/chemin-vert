<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title">Chemin Vert — Boutique</title>
  <meta name="description" data-i18n="meta.desc" content="La boutique Chemin Vert : autocollants, badges et objets pour afficher votre engagement." />
  <meta name="theme-color" content="#14713c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2314713c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="bg-leaves" id="leaves"></div>
  </div>

  <div id="site-header"></div>

  <main>
    <header class="page-head">
      <div class="container">
        <p class="tag reveal" data-i18n="shop.tag">Boutique</p>
        <h1 class="page-head__title reveal" data-i18n="shop.title">Affichez votre engagement</h1>
        <p class="section__intro section__intro--center reveal" data-i18n="shop.text"></p>
      </div>
    </header>

    <section class="section section--tight section--shop">
      <div class="container">
        <!-- Affiché uniquement si le catalogue Printful n'est pas joignable -->
        <div class="shop-notice reveal" id="shopNotice" hidden>
          <span class="shop-notice__badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <div class="shop-notice__text">
            <strong data-i18n="shop.notready_t">La boutique ouvre bientôt</strong>
            <p data-i18n="shop.notready_d">Les ventes ne sont pas encore actives.</p>
          </div>
        </div>

        <!-- Catalogue chargé automatiquement depuis Printful -->
        <div class="shop__grid" id="shopGrid">
          <p class="shop__loading" data-i18n="shop.loading">Chargement de la boutique…</p>
        </div>
      </div>
    </section>

    <!-- Bouton panier flottant -->
    <button class="cart-fab" id="cartFab" aria-label="Panier">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span class="cart-fab__badge" id="cartBadge">0</span>
    </button>

    <!-- Tiroir panier -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart" id="cart" aria-hidden="true">
      <div class="cart__head">
        <h2 data-i18n="shop.cart">Panier</h2>
        <button class="cart__close" id="cartClose" aria-label="Fermer">&times;</button>
      </div>
      <div class="cart__items" id="cartItems"></div>
      <div class="cart__foot">
        <div class="cart__total">
          <span data-i18n="shop.total">Total</span>
          <strong id="cartTotal">0&nbsp;€</strong>
        </div>
        <button class="btn btn--primary btn--lg cart__checkout" id="cartCheckout" data-i18n="shop.checkout">Commander</button>
        <p class="cart__msg" id="cartMsg" role="status" aria-live="polite"></p>
      </div>
    </aside>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/signatures.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
