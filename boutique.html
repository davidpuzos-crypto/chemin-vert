<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title">Chemin Vert — Boutique</title>
  <meta name="description" data-i18n="meta.desc" content="La boutique Chemin Vert : autocollants, badges et objets pour afficher votre engagement." />
  <meta name="theme-color" content="#14713c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2314713c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="bg-leaves" id="leaves"></div>
  </div>

  <div id="site-header"></div>

  <main>
    <header class="page-head">
      <div class="container">
        <p class="tag reveal" data-i18n="shop.tag">Boutique</p>
        <h1 class="page-head__title reveal" data-i18n="shop.title">Affichez votre engagement</h1>
        <p class="section__intro section__intro--center reveal" data-i18n="shop.text"></p>
      </div>
    </header>

    <section class="section section--tight section--shop">
      <div class="container">
        <!-- Affiché uniquement si le catalogue Printful n'est pas joignable -->
        <div class="shop-notice reveal" id="shopNotice" hidden>
          <span class="shop-notice__badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <div class="shop-notice__text">
            <strong data-i18n="shop.notready_t">La boutique ouvre bientôt</strong>
            <p data-i18n="shop.notready_d">Les ventes ne sont pas encore actives.</p>
          </div>
        </div>

        <!-- Catalogue chargé automatiquement depuis Printful -->
        <div class="shop__grid" id="shopGrid"></div>

        <ul class="shop-trust" id="shopTrust" hidden>
          <li>
            <span class="shop-trust__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <div><strong data-i18n="shop.trust1_t">Paiement sécurisé</strong>
            <p data-i18n="shop.trust1_d"></p></div>
          </li>
          <li>
            <span class="shop-trust__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c4-3 7-6.5 7-10.5A7 7 0 0 0 5 10.5C5 14.5 8 18 12 21Z"/><path d="M12 21V9"/><path d="M12 13c-2 0-3.5-1.5-3.5-3.5"/></svg>
            </span>
            <div><strong data-i18n="shop.trust2_t">Impression à la demande</strong>
            <p data-i18n="shop.trust2_d"></p></div>
          </li>
          <li>
            <span class="shop-trust__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg>
            </span>
            <div><strong data-i18n="shop.trust3_t">Livraison</strong>
            <p data-i18n="shop.trust3_d"></p></div>
          </li>
        </ul>
      </div>
    </section>

    <!-- Bouton panier flottant -->
    <button class="cart-fab" id="cartFab" data-i18n-attr="aria-label:shop.cart" aria-label="Panier" aria-haspopup="dialog">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span class="cart-fab__badge" id="cartBadge">0</span>
    </button>

    <!-- Tiroir panier -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true">
      <div class="cart__head">
        <h2 id="cartTitle"><span data-i18n="shop.cart">Panier</span><span class="cart__count" id="cartCount"></span></h2>
        <button class="cart__close" id="cartClose" data-i18n-attr="aria-label:shop.close" aria-label="Fermer le panier">&times;</button>
      </div>
      <div class="cart__items" id="cartItems"></div>
      <div class="cart__foot">
        <div class="cart__total">
          <span data-i18n="shop.subtotal">Sous-total</span>
          <strong id="cartTotal">0&nbsp;€</strong>
        </div>
        <p class="cart__shipnote" data-i18n="shop.shipping_note"></p>
        <button class="btn btn--primary btn--lg cart__checkout" id="cartCheckout">
          <span data-i18n="shop.checkout">Commander</span>
        </button>
        <p class="cart__secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="shop.secure">Paiement sécurisé par Stripe</span>
        </p>
        <p class="cart__msg" id="cartMsg" role="status" aria-live="polite"></p>
      </div>
    </aside>

    <div class="toast" id="shopToast" role="status" aria-live="polite" hidden></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/signatures.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
